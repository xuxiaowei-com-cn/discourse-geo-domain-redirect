plugins:
  geo_domain_redirect_enabled:
    default: true
    client: true
  geo_domain_redirect_header:
    default: "Ali-IP-Country"
    client: false
  geo_domain_redirect_country_code:
    default: "CN"
    client: true
  geo_domain_redirect_target_domain:
    default: "www.xuxiaowei.com.cn"
    client: true
  geo_domain_redirect_main_domain:
    default: ""
    client: true
  geo_domain_redirect_allowed_domains:
    type: list
    default: ""
    client: true
  geo_domain_redirect_use_target_domain_for_country:
    default: false
    client: true
  geo_domain_redirect_snooze_options:
    type: list
    default: "1|7|30"
    client: true
